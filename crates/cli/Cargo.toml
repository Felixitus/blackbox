[package]
name = "blackbox-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
blackbox-core = { version = "0.1.0", path = "../core" }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[[bin]]
name = "blackbox"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
